<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ReelSync Sample Test Reel</title>
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      box-sizing: border-box;
    }
    #ball {
      width: 140px;
      height: 140px;
      border-radius: 70px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      position: absolute;
      top: 250px;
      left: 120px;
      box-shadow: 0 10px 25px rgba(236, 72, 153, 0.5);
    }
    h1 {
      font-size: 52px;
      margin: 0 0 16px 0;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 32px;
      font-weight: bold;
      color: #38bdf8;
      background: rgba(15, 23, 42, 0.8);
      padding: 10px 24px;
      border-radius: 20px;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div id="ball"></div>
  <h1>Reel Studio</h1>
  <div class="badge" id="time-badge">Time: 0.00s</div>
  <button id="silentBtn" style="display:none">Silent Mode</button>

  <script>
    window.silent = { duration: 2.0, currentTime: 0 };
    window.started = false;
    let audio = null;

    function begin() {
      setTimeout(() => {
        window.started = true;
      }, 100);
    }

    const ball = document.getElementById('ball');
    const badge = document.getElementById('time-badge');

    function animate(t) {
      const timeSec = performance.now() / 1000;
      const x = Math.sin(timeSec * 2.5) * 160;
      const y = Math.cos(timeSec * 2.5) * 160;
      ball.style.transform = `translate(${x}px, ${y}px)`;
      badge.textContent = `Time: ${timeSec.toFixed(2)}s`;
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
